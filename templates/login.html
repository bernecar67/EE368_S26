<!DOCTYPE html>
<html>
<head>
    <title>Login Page </title>
    <style>
        .error {
            color: red;
            font-size: 0.9em;
        }
    </style>
    <script>
        function toggle() {
            const passwordInput = document.getElementById("password");
            passwordInput.type =
                passwordInput.type === "password" ? "text" : "password";
        }
    </script>
</head>
<body>
    <h1>Login Page</h1>
    <form action="/login" method="post">
        {% if errors.email %}
            <div class="error">
                Email is not registered. Please sign up 
                <a href="/signup">{{ errors.email }}</a>
            </div>
        {% endif %}
        {% if errors.blankemail %}
            <div class="error">{{ errors.blankemail }}</div>
        {% endif %}
        <label for="email">Email:</label>
        <input type="text" id="email" name="email"><br><br>

        {% if errors.password %}
            <div class="error">{{ errors.password }}</div>
        {% endif %}
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <input type="checkbox" onclick="toggle()"> Show Password<br><br>

        <input type="submit" value="Login">
    </form>
    <form action="/change" method="get">
        <br><input type="submit" value="Go to Change Password Page">
    </form>
    <br><a href="/">Go to Home Page</a>
</body>
</html>
